<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Microsoft YaHei, SimHei, sans-serif">
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="17" font-weight="bold">图 1  《培训平台》需求分析 · 系统用例图</text>

  <!-- 系统边界 -->
  <rect x="360" y="60" width="570" height="540" fill="#fbfcfd" stroke="#333" stroke-width="1.2"/>
  <text x="645" y="82" text-anchor="middle" font-size="13" fill="#666">编程培训平台管理平台</text>

  <!-- 参与者：火柴人 -->
  <g stroke="#222" stroke-width="1.6" fill="none">
    <circle cx="120" cy="120" r="13"/><path d="M120 133 V175 M98 150 H142 M120 175 L100 210 M120 175 L140 210"/>
    <circle cx="120" cy="280" r="13"/><path d="M120 293 V335 M98 310 H142 M120 335 L100 370 M120 335 L140 370"/>
    <circle cx="120" cy="425" r="13"/><path d="M120 438 V480 M98 455 H142 M120 480 L100 515 M120 480 L140 515"/>
    <circle cx="120" cy="560" r="13"/><path d="M120 573 V600 M98 590 H142"/>
  </g>
  <text x="120" y="228" text-anchor="middle" font-size="13">超级管理员</text>
  <text x="120" y="388" text-anchor="middle" font-size="13">教务管理员</text>
  <text x="120" y="533" text-anchor="middle" font-size="13">教师</text>
  <text x="120" y="618" text-anchor="middle" font-size="13">学员</text>

  <!-- 用例 -->
  <g fill="#ffffff" stroke="#444" stroke-width="1.2">
    <ellipse cx="620" cy="105" rx="150" ry="20"/>
    <ellipse cx="620" cy="150" rx="150" ry="20"/>
    <ellipse cx="620" cy="205" rx="150" ry="20"/>
    <ellipse cx="620" cy="250" rx="150" ry="20"/>
    <ellipse cx="620" cy="295" rx="150" ry="20"/>
    <ellipse cx="620" cy="340" rx="150" ry="20"/>
    <ellipse cx="620" cy="395" rx="150" ry="20"/>
    <ellipse cx="620" cy="440" rx="150" ry="20"/>
    <ellipse cx="620" cy="485" rx="150" ry="20"/>
    <ellipse cx="620" cy="540" rx="150" ry="20"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#111">
    <text x="620" y="110">账号与角色权限管理</text>
    <text x="620" y="155">权限维护</text>
    <text x="620" y="210">学生信息与班级维护</text>
    <text x="620" y="255">缴费与欠费管理</text>
    <text x="620" y="300">确认收款</text>
    <text x="620" y="345">新闻发布与管理</text>
    <text x="620" y="400">成绩录入与统计</text>
    <text x="620" y="445">学员考勤记录</text>
    <text x="620" y="490">学生作品点评</text>
    <text x="620" y="545">查看我的成绩 / 课表 / 考勤 / 档案</text>
  </g>

  <!-- 参与者与用例的关联 -->
  <g stroke="#333" stroke-width="1.1" fill="none">
    <path d="M140 150 L470 105"/>
    <path d="M140 150 L470 150"/>
    <path d="M140 310 L470 210"/>
    <path d="M140 310 L470 255"/>
    <path d="M140 310 L470 345"/>
    <path d="M140 455 L470 400"/>
    <path d="M140 455 L470 445"/>
    <path d="M140 455 L470 490"/>
    <path d="M140 590 L470 545"/>
  </g>

  <!-- include / extend 关系 -->
  <g stroke="#333" stroke-width="1" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
  </defs>
  <path d="M620 320 L620 276"/>
  <path d="M620 170 L620 126"/>
  <text x="530" y="303" font-size="11" fill="#555">«include»</text>
  <text x="530" y="153" font-size="11" fill="#555">«extend»</text>

  <text x="30" y="632" font-size="11" fill="#777">说明：管理员维护账号与权限；教务维护学员、班级、缴费与新闻；教师录成绩、记考勤、点评作品；学员自助查询。</text>
</svg>
