<!DOCTYPE html>
<html lang="zh-CN" data-root="" data-page="login">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>一键登录 - 编程培训平台管理平台</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0e9c86 0%, #0b8371 60%, #08685a 100%);
        }
        .login-box {
            width: 420px;
            max-width: calc(100vw - 32px);
            padding: 40px 36px 32px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .22);
            text-align: center;
        }
        .login-logo {
            width: 66px; height: 66px; margin: 0 auto 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: #fff; background: var(--brand); border-radius: 16px;
        }
        .login-brand { font-size: 20px; font-weight: 700; color: #1b6fb8; letter-spacing: 2px; }
        .login-title { margin-top: 12px; font-size: 17px; font-weight: 600; color: #333; }
        .login-desc { margin-top: 8px; font-size: 13px; color: #8a9099; line-height: 1.7; }
        .login-btn {
            width: 100%; height: 46px; margin-top: 26px;
            font-size: 16px; font-family: inherit; font-weight: 600;
            color: #fff; background: linear-gradient(180deg, #12b39a, #0e9c86);
            border: none; border-radius: 6px; cursor: pointer;
        }
        .login-btn:hover { filter: brightness(1.05); }
        .login-btn[disabled] { opacity: .7; cursor: wait; }
        .login-roles { margin-top: 22px; text-align: left; }
        .login-roles li { font-size: 13px; color: #666; line-height: 2; }
        .login-foot { margin-top: 20px; font-size: 12px; color: #b0b6bd; line-height: 1.7; }
    </style>
</head>
<body>
<div class="login-box">
    <div class="login-logo">🌐</div>
    <div class="login-brand">江京教育</div>
    <div class="login-title">编程培训平台管理平台</div>
    <div class="login-desc">
        本平台采用<b>一键登录</b>：点击下方按钮即可进入，<br>
        无需输入用户名、密码，也无需选择角色。
    </div>
    <button class="login-btn" type="button" id="loginBtn">一键登录</button>
    <ul class="login-roles">
        <li>· 登录后自动加载当前账号的权限与菜单</li>
        <li>· 右上角「个人中心」可查看资料与会员权益</li>
        <li>· 顶部「进入编程环境」可切换父系统下的子系统</li>
    </ul>
    <div class="login-foot">
        默认以管理员身份进入（演示账号：admin / 覃艳）<br>
        后端未启动时自动使用内置演示数据
    </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/components.js"></script>
<script>
    (function () {
        var btn = document.getElementById('loginBtn');

        function enter(data) {
            localStorage.setItem('jp_token', data.token);
            localStorage.setItem('jp_user', JSON.stringify(data.user || {}));
            localStorage.setItem('jp_permissions', JSON.stringify(data.permissions || []));
            location.replace(JP_CONFIG.home);
        }

        btn.addEventListener('click', function () {
            btn.disabled = true;
            btn.textContent = '正在登录…';
            JP.api.post('auth/one-key-login', {}).then(function (data) {
                enter(data);
            }).catch(function (err) {
                btn.disabled = false;
                btn.textContent = '一键登录';
                JP.ui.toast('登录失败：' + err.message, 'error');
            });
        });

        /* 已登录过则提示可直接进入 */
        if (localStorage.getItem('jp_token')) {
            var tip = document.createElement('div');
            tip.className = 'login-desc';
            tip.style.marginTop = '16px';
            tip.innerHTML = '检测到已有登录状态，<a href="' + JP_CONFIG.home + '" style="color:#0e9c86">点击直接进入平台 →</a>';
            document.querySelector('.login-roles').after(tip);
        }
    })();
</script>
</body>
</html>
