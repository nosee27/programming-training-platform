<!DOCTYPE html>
<html lang="zh-CN" data-root="../../" data-page="student-basic" data-perm="student:basic:list" data-title="学生基本信息">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学生基本信息 - 编程培训平台管理平台</title>
    <script src="../../assets/js/auth-guard.js"></script>
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<div class="jp-layout">
    <header class="jp-header" id="jpHeader"></header>
    <aside class="jp-sidebar" id="jpSidebar"></aside>
    <main class="jp-main">
        <div class="jp-stats" id="jpStats"></div>
        <div class="jp-card">
            <h2 class="jp-card__title">学生基本信息</h2>
            <div id="jpToolbar"></div>
            <div id="jpTable"></div>
            <div id="jpPager" class="jp-pager"></div>
        </div>
    </main>
</div>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/mock-data.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/components.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/page-list.js"></script>
<script>
    var CLASS_OPTIONS = [
        { value: '', label: '全部班级' },
        { value: 'Python 全栈 2603 班', label: 'Python 全栈 2603 班' },
        { value: '算法竞赛 2601 班', label: '算法竞赛 2601 班' },
        { value: '-', label: '未分班' }
    ];

    var listApi = JP.page.list({
        url: 'students',
        searchPlaceholder: '搜索学号 / 姓名 / 电话',
        filters: [
            { key: 'className', options: CLASS_OPTIONS },
            { key: 'status', options: [
                { value: '', label: '全部状态' },
                { value: '1', label: '在读' },
                { value: '2', label: '已结业' },
                { value: '3', label: '休学' },
                { value: '4', label: '退学' }
            ] }
        ],
        toolbar: [
            { text: '+ 新增学生', type: 'primary', perm: 'student:basic:add', onClick: function (ctx) { studentForm(null, ctx); } },
            { text: '导出学生', perm: 'student:basic:export', onClick: function () { JP.ui.toast('演示模式：导出任务已创建（对接后端后可下载 Excel）'); } }
        ],
        columns: [
            { key: 'studentNo', title: '学号' },
            { key: 'name', title: '姓名' },
            { key: 'gender', title: '性别', render: function (r) { return JP.ui.dictText('gender', r.gender); } },
            { key: 'className', title: '所属班级' },
            { key: 'phone', title: '联系电话' },
            { key: 'guardianName', title: '监护人' },
            { key: 'enrollDate', title: '报名日期' },
            { key: 'source', title: '报名来源' },
            { key: 'status', title: '状态', render: function (r) { return JP.ui.dictTag('studentStatus', r.status); } }
        ],
        actions: [
            { text: '查看', onClick: function (row) {
                JP.ui.detail('学生详情 · ' + row.name, [
                    ['学号', JP.ui.esc(row.studentNo)],
                    ['姓名', JP.ui.esc(row.name) + '（' + JP.ui.dictText('gender', row.gender) + '）'],
                    ['所属班级', JP.ui.esc(row.className)],
                    ['联系电话', JP.ui.esc(row.phone || '-')],
                    ['监护人', JP.ui.esc((row.guardianName || '-') + ' ' + (row.guardianPhone || ''))],
                    ['报名日期', JP.ui.esc(row.enrollDate || '-')],
                    ['报名来源', JP.ui.esc(row.source || '-')],
                    ['当前状态', JP.ui.dictTag('studentStatus', row.status)]
                ], '<div class="jp-section-title" style="margin-top:18px">关联数据</div>' +
                    '<div style="line-height:2;font-size:13px;color:#666">该学生的考勤、缴费、学习档案与作品可分别在「学生管理」对应子页面中查看。</div>');
            } },
            { text: '编辑', perm: 'student:basic:edit', onClick: function (row) { studentForm(row); } },
            { text: '删除', perm: 'student:basic:delete', onClick: function (row) {
                JP.ui.confirm({
                    title: '删除学生', message: '确定删除学生「' + row.name + '」吗？其考勤 / 缴费 / 档案记录也将一并失效。',
                    onOk: function () {
                        JP.page.save({
                            url: '/students/' + row.id,
                            method: 'DELETE',
                            successText: '学生已删除',
                            onDone: function () { listApi.reload(); }
                        });
                    }
                });
            } }
        ]
    });

    function studentForm(row, ctx) {
        JP.ui.formModal({
            title: row ? '编辑学生' : '新增学生',
            values: row || { gender: '1', status: '1' },
            fields: [
                { key: 'studentNo', label: '学号', required: !row, placeholder: '如 S2026013' },
                { key: 'name', label: '姓名', required: true },
                { key: 'gender', label: '性别', type: 'select', options: [{ value: '1', label: '男' }, { value: '2', label: '女' }] },
                { key: 'guardianPhone', label: '监护人电话' },
                { key: 'className', label: '所属班级', type: 'select', options: CLASS_OPTIONS },
                { key: 'phone', label: '联系电话' },
                { key: 'enrollDate', label: '报名日期', type: 'date' },
                { key: 'source', label: '报名来源', type: 'select', options: [
                    { value: '线上推广', label: '线上推广' },
                    { value: '老学员推荐', label: '老学员推荐' },
                    { value: '线下活动', label: '线下活动' },
                    { value: '学校合作', label: '学校合作' }
                ] },
                { key: 'status', label: '状态', type: 'select', options: [
                    { value: '1', label: '在读' }, { value: '2', label: '已结业' }, { value: '3', label: '休学' }, { value: '4', label: '退学' }
                ] }
            ],
            onSubmit: function (data) {
                JP.page.save({
                    url: row ? '/students/' + row.id : '/students',
                    method: row ? 'PUT' : 'POST',
                    data: data,
                    successText: row ? '学生信息已保存' : '学生已新增',
                    onDone: function () {
                        if (ctx && ctx.reload) ctx.reload();
                        else if (listApi) listApi.reload();
                    }
                });
            }
        });
    }

    /* 概览：学生总数 / 在读 / 欠费 / 平均测评分 */
    /* 全校经营指标只对拥有 dashboard:view 的管理端开放，学员/教师看到的是空统计 */
    var statsBox = document.getElementById('jpStats');
    if (!JP.session.hasPerm('dashboard:view') && statsBox) statsBox.style.display = 'none';
    JP.api.get('stats/overview').then(function (d) {
        document.getElementById('jpStats').innerHTML = [
            { label: '学生总数', value: d.studentTotal, unit: '人' },
            { label: '在读学员', value: d.inClass, unit: '人' },
            { label: '欠费学生', value: d.arrearsCount, unit: '人' },
            { label: '测评平均分', value: d.avgScore, unit: '分' }
        ].map(function (i) {
            return '<div class="jp-stat"><div class="jp-stat__label">' + i.label + '</div>' +
                '<div class="jp-stat__value">' + i.value + '<small>' + i.unit + '</small></div></div>';
        }).join('');
    });
</script>
</body>
</html>
