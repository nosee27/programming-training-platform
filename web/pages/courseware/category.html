<!DOCTYPE html>
<html lang="zh-CN" data-root="../../" data-page="courseware-category" data-perm="courseware:list" data-title="课件分类">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>课件分类 - 编程培训平台管理平台</title>
    <script src="../../assets/js/auth-guard.js"></script>
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<div class="jp-layout">
    <header class="jp-header" id="jpHeader"></header>
    <aside class="jp-sidebar" id="jpSidebar"></aside>
    <main class="jp-main">
        <div class="jp-card">
            <h2 class="jp-card__title">课件分类</h2>
            <div id="jpToolbar"></div>
            <div id="jpTable"></div>
            <div id="jpPager" class="jp-pager"></div>
        </div>
    </main>
</div>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/mock-data.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/components.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/page-list.js"></script>
<script>
    JP.page.list({
        url: 'courseware-categories',
        searchPlaceholder: '搜索分类名称',
        toolbar: [
            { text: '+ 新增分类', type: 'primary', perm: 'courseware:upload', onClick: function (ctx) {
                JP.ui.formModal({
                    title: '新增课件分类',
                    fields: [
                        { key: 'categoryName', label: '分类名称', required: true },
                        { key: 'remark', label: '备注', full: true }
                    ],
                    onSubmit: function () { JP.ui.toast('演示模式：分类未写入后端', 'success'); ctx.reload(); }
                });
            } }
        ],
        columns: [
            { key: 'categoryName', title: '分类名称', render: function (r) { return JP.ui.tag(r.categoryName); } },
            { key: 'fileCount', title: '课件数量', align: 'center' },
            { key: 'remark', title: '备注', wrap: true }
        ],
        actions: [
            { text: '查看课件', onClick: function () { location.href = 'index.html'; } },
            { text: '编辑', perm: 'courseware:upload', onClick: function (row) {
                JP.ui.formModal({
                    title: '编辑分类', values: row,
                    fields: [
                        { key: 'categoryName', label: '分类名称', required: true },
                        { key: 'remark', label: '备注', full: true }
                    ],
                    onSubmit: function () { JP.ui.toast('演示模式：分类未写入后端', 'success'); }
                });
            } }
        ]
    });
</script>
</body>
</html>
